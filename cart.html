<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - CLICON</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">
</head>
<body>


    <!-- ================= HEADER ================= -->
     <header class="site-header">
        <!-- Top Information Bar -->
        <div class="header-top">
            <div class="container header-top-container">
                <p class="welcome-msg">Welcome to Clicon online eCommerce store.</p>
                <div class="header-top-right">
                  <div class="social-links">
                    <span>Follow us:</span>
                
                    <a href="#" aria-label="Twitter" class="social-icon">
                        <img src="images/twitter.svg" alt="Twitter">
                    </a>
                    <a href="#" aria-label="Facebook" class="social-icon">
                        <img src="images/facebook.svg" alt="Facebook">
                    </a>
                    <a href="#" aria-label="Pinterest" class="social-icon">
                        <img src="images/pinterest.svg" alt="Pinterest">
                    </a>
                    <a href="#" aria-label="Reddit" class="social-icon">
                        <img src="images/reddit.svg" alt="Reddit">
                    </a>
                     <a href="#" aria-label="YouTube" class="social-icon">
                        <img src="images/youtube.svg" alt="youtube">
                    </a>
                     <a href="#" aria-label="Instagram" class="social-icon">
                        <img src="images/instagram.svg" alt="Instagram">
                    </a>
                </div>
                    <div class="header-dropdowns">
                        <button class="dropdown-btn">Eng <span>˅</span></button>
                        <button class="dropdown-btn">USD <span>˅</span></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Middle Header with Search & Icons -->
        <div class="main-header">
            <div class="container main-header-container">
                <!-- Logo Container (Ready for SVG insertion) -->
                <a href="index.html" class="logo-link">
                    <div class="logo">
                       <img src="images/logo.svg" alt="CLICON Logo" style="height: 32px; width: auto;">
                    </div>
                </a>

                <!-- Search Bar -->
                <div class="search-box">
                    <input type="text" placeholder="Search for anything..." />
                    <button class="search-btn" aria-label="Search">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#191C1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                </div>

                <!-- Header Action Icons -->
                <div class="header-icons">
                    <div class="cart-icon" id="cart-icon" title="View Cart">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                        <span id="cart-count">0</span>
                    </div>
                    <a href="#" class="header-icon-link" title="Wishlist">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                    </a>
                    <a href="#" class="header-icon-link" title="User Account">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </a>
                </div>
            </div>
        </div>

        <!-- Lower Category Navigation Bar -->
        <nav class="sub-nav">
            <div class="container sub-nav-container">
                <button class="category-dropdown-btn">
                    All Category
                    <span>˅</span>
                </button>
                <div class="nav-links">
                    <a href="#">Track Order</a>
                    <a href="#">Compare</a>
                    <a href="#">Customer Support</a>
                    <a href="#">Need Help</a>
                </div>
            </div>
        </nav>
    </header>

    <!-- ================= BREADCRUMB ================= -->
    <div class="breadcrumb">
        <div class="container">
            <a href="index.html">Home</a> <span>›</span> <span class="active">Shopping Card</span>
        </div>
    </div>

    <!-- ================= CART CONTENT ================= -->
    <main class="cart-page">
        <div class="container cart-layout">
            <section class="cart-table-container">
                <h3>Shopping Card</h3>
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>PRODUCTS</th>
                            <th>PRICE</th>
                            <th>QUANTITY</th>
                            <th>SUB-TOTAL</th>
                        </tr>
                    </thead>
                    <tbody id="cart-items-body">
                    </tbody>
                </table>

                <div class="cart-actions">
                    <a href="index.html" class="btn btn-secondary">← RETURN TO SHOP</a>
                    <button id="update-cart-btn" class="btn btn-outline">UPDATE CART</button>
                </div>
            </section>

            <aside class="cart-summary-card">
                <h3>Card Totals</h3>
                <div class="summary-row">
                    <span>Sub-total</span>
                    <span id="summary-subtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Shipping</span>
                    <span>Free</span>
                </div>
                <div class="summary-row">
                    <span>Discount</span>
                    <span id="summary-discount">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Tax</span>
                    <span id="summary-tax">$0.00</span>
                </div>
                <hr class="summary-divider">
                <div class="summary-total-row">
                    <span>Total</span>
                    <strong id="summary-total">$0.00 USD</strong>
                </div>
                <button class="btn checkout-btn">PROCEED TO CHECKOUT →</button>
            </aside>
        </div>
    </main>

    <script src="js/script.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
